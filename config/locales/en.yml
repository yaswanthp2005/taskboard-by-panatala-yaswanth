      card_updated: "updated this card"
      card_moved: "moved this card to {{listTitle}}"
      card_deleted: "deleted this card"
      member_invited: "invited {{inviteeName}} to the board"
      list_created: "created the list {{listTitle}}"
      list_updated: "updated the list {{listTitle}}"
      list_deleted: "deleted the list {{listTitle}}"
